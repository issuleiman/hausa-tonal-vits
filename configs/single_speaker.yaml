model:
  data_dir: ''
  sampling_rate: 22050
  n_fft: 1024
  hop_length: 256
  win_length: 1024
  n_mels: 80
  fmin: 0.0
  fmax: 8000.0
  spec_channels: 513
  segment_size: 8192
  f0_min_hz: 60.0
  f0_max_hz: 500.0
  n_vocab: 42
  n_tone: 5
  n_length: 3
  n_utt_type: 3
  vowel_ids:
  - 6
  - 10
  - 16
  - 24
  - 31
  silence_ids:
  - 4
  - 5
  hidden_channels: 192
  filter_channels: 768
  attn_hidden_scale: 1
  inter_channels: 192
  n_heads: 2
  n_layers: 6
  kernel_size: 3
  p_dropout: 0.1
  window_size: 4
  n_flows: 4
