  - 8
  - 2
  - 2
  upsample_kernel_sizes:
  - 16
  - 16
  - 4
  - 4
  resblock: '1'
  resblock_kernel_sizes:
  - 3
  - 7
  - 11
  resblock_dilation_sizes:
  - !!python/tuple
    - 1
    - 3
    - 5
  - !!python/tuple
    - 1
    - 3
    - 5
  - !!python/tuple
    - 1
    - 3
    - 5
  speaker_source: none
  n_speakers: 1
  gin_channels: 0
  speaker_enc_channels: 128
