  betas:
  - 0.8
  - 0.99
  eps: 1.0e-09
  lr_decay: 0.999875
  batch_size: 16
  epochs: 500
  warmup_epochs: 5
  c_mel: 45.0
  c_kl: 1.0
  c_dur: 1.0
  c_pitch: 2.0
  c_energy: 1.0
  c_prosody: 0.5
  c_tone: 1.0
  c_tonal_adv: 0.5
  c_harmonic: 0.5
