  seed: 1234
  device: cuda
  num_workers: 4
train:
  data_dir: data
  train_list: data/train.txt
  val_list: data/val.txt
  out_dir: runs/hausa_vits
  log_interval: 50
  eval_interval: 500
  save_interval: 1000
  spec_cache: true
  f0_cache: true
  grad_clip: 1.0
  fp16: false
  use_tone_adv: true
  use_tone_cls: true
  use_harmonic: true
  tensorboard: true
  seed: 1234
